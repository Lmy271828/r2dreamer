task: 'firstlight_swarm'
steps: 2e5
env_num: 1
eval_episode_num: 0
action_repeat: 1
train_ratio: 16
time_limit: 1300

seed: ${seed}
device: ${device}

size: [176, 128]
speed: 2.0
capture: 'stream'
deck_mode: 'random_paired'  # M5 主线：奇偶局同 seed 成对换边（运气对消，见 docs/ablation_paired_swap.md）
opp_policy: 'selfplay'   # M5：对手 = 主策略冻结快照（前 40 局脚本热身，每 30 局刷新）
selfplay_warmup: 40
selfplay_refresh: 30
# 每 env 一个 MuMu 实例：env0 = index 1（原实例），env1 = index 0（克隆）
serials: ['127.0.0.1:16416', '127.0.0.1:16384']
control_ports: [26789, 26790]
vm_indexes: [1, 0]       # env0=instance1（原），env1=instance0（克隆）
vm_names: ['皇室战争模拟器', '皇室战争模拟器-1']

encoder:
  mlp_keys: '^(elixir|elixir_rate)$'
  cnn_keys: 'image'
decoder:
  mlp_keys: '$^'
  cnn_keys: 'image'
