defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'

hydra:
  run:
    dir: ${logdir}

batch_size: 8
batch_length: 32

wandb:
  enabled: True
  project: r2dreamer_for_cr
  entity: lmy03022006-south-china-university-of-technology   # Owner："Muyang Li" 的 wandb slug
  mode: online          # online / offline / disabled；无凭据时自动降级为 TensorBoard

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 1e5
  device: ${device}
  storage_device: 'cpu'
  online: True
  update_latents: False

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 1e3
  action_repeat: ${env.action_repeat}
